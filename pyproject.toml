[project]
name = "pcb"
version = "1.0.0"
description = "persona-length-content-bench: how far dialogue LLMs keep a persona, a word limit and required content at once, and what they drop first"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pcb = "pcb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcb"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
