# Models under evaluation. Every entry is an OpenAI-compatible chat endpoint (vLLM).
# Local models are served by scripts/run_models_thalys.sh (one vLLM server at a time per GPU).
# API keys are read from the env var named in api_key_env.
defaults:
  temperature: 0.7
  max_tokens: 300
  concurrency: 32
  timeout: 300

models:
  # ---- local (vLLM); `serve` holds extra vllm flags, `gpu_mem` the utilisation fraction ----
  - name: gemma-4-31b-it
    model_id: google/gemma-4-31B-it
    base_url: http://127.0.0.1:8300/v1
    serve: "--max-model-len 8192"
  - name: qwen3.5-27b
    model_id: Qwen/Qwen3.5-27B
    base_url: http://127.0.0.1:8300/v1
    extra_body: {chat_template_kwargs: {enable_thinking: false}}   # thinking is on by default
    serve: "--max-model-len 8192"
  - name: llama-3.1-8b-instruct
    model_id: meta-llama/Llama-3.1-8B-Instruct
    base_url: http://127.0.0.1:8300/v1
    serve: "--max-model-len 8192"
  - name: mistral-small-3.2-24b
    model_id: mistralai/Mistral-Small-3.2-24B-Instruct-2506
    base_url: http://127.0.0.1:8300/v1
    serve: "--max-model-len 8192 --tokenizer-mode mistral --config-format mistral --load-format mistral"
  - name: olmo-3-7b-instruct
    model_id: allenai/Olmo-3-7B-Instruct
    base_url: http://127.0.0.1:8300/v1
    # vllm 0.25 reads config.rope_parameters["rope_theta"], which transformers 5.13 drops for Olmo3;
    # re-inject the values from config.json
    serve: "--max-model-len 8192 --hf-overrides {\"rope_parameters\":{\"rope_type\":\"yarn\",\"rope_theta\":500000,\"factor\":8.0,\"original_max_position_embeddings\":8192,\"attention_factor\":1.2079441541679836,\"beta_fast\":32.0,\"beta_slow\":1.0}}"
  # ---- small models (2026-10-30): same lineage as the main three + other families ----
  - name: gemma-4-e2b-it
    model_id: google/gemma-4-E2B-it
    base_url: http://127.0.0.1:8300/v1
    serve: "--max-model-len 8192"
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
  - name: gemma-4-e4b-it
    model_id: google/gemma-4-E4B-it
    base_url: http://127.0.0.1:8300/v1
    serve: "--max-model-len 8192"
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
  - name: gemma-4-12b-it
    model_id: google/gemma-4-12B-it
    base_url: http://127.0.0.1:8300/v1
    serve: "--max-model-len 8192"
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
  - name: qwen3.5-2b
    model_id: Qwen/Qwen3.5-2B
    base_url: http://127.0.0.1:8300/v1
    serve: "--max-model-len 8192"
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
  - name: qwen3.5-4b
    model_id: Qwen/Qwen3.5-4B
    base_url: http://127.0.0.1:8300/v1
    serve: "--max-model-len 8192"
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
  - name: qwen3.5-9b
    model_id: Qwen/Qwen3.5-9B
    base_url: http://127.0.0.1:8300/v1
    serve: "--max-model-len 8192"
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
  - name: ministral-3-3b
    model_id: mistralai/Ministral-3-3B-Instruct-2512-BF16   # default repo is FP8; BF16 to match the others
    base_url: http://127.0.0.1:8300/v1
    serve: "--max-model-len 8192 --tokenizer-mode mistral --config-format mistral --load-format mistral"
  - name: ministral-3-8b
    model_id: mistralai/Ministral-3-8B-Instruct-2512-BF16
    base_url: http://127.0.0.1:8300/v1
    serve: "--max-model-len 8192 --tokenizer-mode mistral --config-format mistral --load-format mistral"
  - name: phi-4-mini
    model_id: microsoft/Phi-4-mini-instruct
    base_url: http://127.0.0.1:8300/v1
    serve: "--max-model-len 8192"
  - name: granite-4.2-3b
    model_id: ibm-granite/granite-4.2-3b
    base_url: http://127.0.0.1:8300/v1
    serve: "--max-model-len 8192"
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
  - name: smollm3-3b
    model_id: HuggingFaceTB/SmolLM3-3B
    base_url: http://127.0.0.1:8300/v1
    serve: "--max-model-len 8192"
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
  # ---- local judges (not in the evaluated set) ----
  - name: gpt-oss-120b
    model_id: openai/gpt-oss-120b
    base_url: http://127.0.0.1:8300/v1
    serve: "--max-model-len 8192"
    extra_body: {reasoning_effort: low}   # reasoning tokens share max_tokens
    max_tokens_extra: 2000
    judge_only: true
  - name: llama-3.3-70b
    model_id: meta-llama/Llama-3.3-70B-Instruct
    base_url: http://127.0.0.1:8300/v1
    serve: "--max-model-len 8192"
    judge_only: true
