# Friend messages for Experiment B, facet design (exp_b4). Ten per IPIP-NEO facet; the high and low poles of a
# facet share the same ten. Each message refers to an upcoming event ("tomorrow's ...") so that the required
# content items ("it starts at 2 pm", "it's in room 202", "bring a charger", "it has been moved to Wednesday")
# read naturally, and each gives the facet a chance to show in the reply without forcing it.
# Drafted 2026-11-07; validated by generating unlimited-budget replies for both poles and checking separation.

