# Experiment C: position baseline. The same kind of instruction is given twice, once in the system message and once
# in the user message, with incompatible values; which one the reply follows is the model's system-vs-user prior for
# that instruction type. Both orders are run. Single-instruction controls place one instruction alone in either
# position. Two trial files are built:
#   exp_c   : length and personality (texting-a-friend frame of experiment B; rated with the observer rating)
#   exp_ca  : content and setting      (chat-partner frame of experiment A; NLI + judge as in experiment A)
seed: 0
max_tokens: 300

length:
  tight: 15          # "at most 15 words": kept by 13/15 models >= 96% when given alone (Phi-4-mini 68%, Ministral 3B 82%)
  loose: 25          # "at least 25 words": 50-99% of unlimited replies are already this long
  # 2026-11-09: extra user-side budgets so that the length axis of experiment B can be compared at each model's
  # capability-matched budget b* (report_position_b); tight -> loose ("at least" for 30 is raised to 50)
  extra_tights: {3: 25, 5: 25, 8: 25, 10: 25, 30: 50}
  n_scenarios: 10    # per facet, i.e. the 300 facet scenarios of exp_b4/b5 (persona off, no content items)

personality:
  n_scenarios: 10    # per facet: system = one pole, user = the other pole of the same facet

content_setting:
  source: a          # exp_a: the 168 verified DNLI contradiction pairs (s1, s2) and the eliciting questions of experiment A

# 2026-11-09: content-vs-content cell in the friend-texting frame of experiment B, so that B's content axis has a
# position baseline. System: "tell your friend all of: <3 items>", user: the same three attributes with different values
# (time / room / day; "bring" is excluded because two things to bring do not contradict). Both orders, unlimited length.
content_b:
  seed: 0
  kinds: [time, room, day]
  n_scenarios: 10
